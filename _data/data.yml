projects:
    title: Projects
    intro: >
    assignments:
      - title: Deployment of an ICU Mortality Prediction Model
        link: "https://github.com/jrepifano/mortality-tool"
        tagline: "ML backend for my mortality prediction web app. This model has been trained to predict all-cause mortality based on first-day lab values. The model achieves state of the art performance over traditional mortality scores such as APACHE and SAPS. The novelty of the method is in its explanation and uncertainty quantification via influence functions and Bayesian inference."
        
      - title: Influence Pytorch
        link: "https://github.com/jrepifano/influence-pytorch"
        tagline: "Extension of influence function implementation for PyTorch. To support my models, a PyTorch compatible implementation of influence functions was needed. This implementation includes end-to-end gradients, enabling efficient computation of feature attribution."
        
      - title: Reinforcement Learning
        link: "https://jrepifano.github.io/papers/Reinforcement_Learning_Final_Project.pdf"
        tagline: "Implementation of Monte Carlo methods to find the optimal blackjack policy. This method achieves the theoretical maximum win-rate without card counting."

      - title: Machine Learning
        link: "https://github.com/jrepifano/Machine-Learning"
        tagline: "Implementation of classical machine learning methods such as Linear/Logistic Regression, SVM, MLP, etc"
